server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  ssl_certificate /etc/ssl/nginx.crt;
  ssl_certificate_key /etc/ssl/nginx.key;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;

  location /grafana/ {
   proxy_pass http://127.0.0.1:3000/;
   proxy_set_header Host $http_host;
  }

  # Prometheus and the Pushgateway have no authentication, and the
  # Pushgateway accepts writes. Serve them only to local clients: the
  # head/login node itself and SSM port forwarding (the SSM agent connects
  # from 127.0.0.1). Everyone else gets 403.
  location /prometheus/ {
   allow 127.0.0.1;
   allow ::1;
   deny all;
   proxy_pass http://127.0.0.1:9090/;
   proxy_set_header Host $http_host;
  }

  location /pushgateway/ {
   allow 127.0.0.1;
   allow ::1;
   deny all;
   proxy_pass http://127.0.0.1:9091/;
   proxy_set_header Host $http_host;
  }
  
  location /slurmexporter/ {
   proxy_pass http://localhost:8080/;
   proxy_set_header Host $http_host;
  }
}