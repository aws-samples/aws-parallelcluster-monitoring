# Compute node monitoring stack for NVIDIA GPU instances.
# Requires nvidia-container-toolkit (installed by installer/install.sh).
#
services:
  prometheus-node-exporter:
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/var/lib/prometheus/node-exporter:/textfile:ro'
    image: quay.io/prometheus/node-exporter:v1.13.1
    command:
      - '--path.rootfs=/host'
      - '--collector.infiniband'
      # EFA hw_counters (RDMA, SRD retransmits, WR errors) are published
      # via the textfile collector by efa-metrics.sh — node_exporter's
      # infiniband collector does not read the hw_counters/ directory.
      - '--collector.textfile'
      - '--collector.textfile.directory=/textfile'

  dcgm-exporter:
    container_name: nvidia-dcgm
    network_mode: host
    pid: host
    restart: unless-stopped
    # Pin the NVIDIA runtime explicitly. installer/install.sh registers the
    # runtime via 'nvidia-ctk runtime configure' but does NOT make it the
    # default, and on this stack (Docker 25 / Compose v5 / AL2023) the
    # deploy.resources device reservation below does not inject the GPU:
    # the container comes up under runc with no NVML inside, so dcgm-exporter
    # runs but reports "NVML doesn't exist on this system" and exports zero
    # DCGM_* series. With runtime: nvidia the toolkit injects the driver
    # stack based on NVIDIA_VISIBLE_DEVICES/NVIDIA_DRIVER_CAPABILITIES.
    # The deploy block is kept for engines that honor device reservations.
    # See #55.
    runtime: nvidia
    # Image is overridable via DCGM_EXPORTER_IMAGE. The default is
    # dcgm-exporter 4.9.0, which ships DCGM 4.7.0 and covers B300 (#50).
    # NVCR publishes it as a Docker manifest list with no attestation
    # manifests, so Docker 29.x can pull it (#47). It is pinned by digest, so
    # a re-pushed tag can't change it. dcgm/counters.csv uses the DCGM 4.7
    # field names, so an override must be dcgm-exporter 4.9.0 or later.
    image: ${DCGM_EXPORTER_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:4.7.0-4.9.0@sha256:2490e1dfb5baaee6765ef2841813af7d978bb459a566c22c326a8fc27c64eea9}
    # Custom counters file enables XID errors, throttle reasons,
    # ECC counters, retired pages, full NVLink error set, and the
    # DCP profiling metrics (SM_ACTIVE / SM_OCCUPANCY / TENSOR / FP64 /
    # FP32 / FP16 / DRAM_ACTIVE) used by gpu-health.json and the
    # Compute Pipeline row on gpu.json.
    command:
      - "-f"
      - "/etc/dcgm-exporter/counters.csv"
    volumes:
      - "__MONITORING_HOME__/dcgm/counters.csv:/etc/dcgm-exporter/counters.csv:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
