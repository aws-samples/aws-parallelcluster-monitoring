#
# HeadNode monitoring stack. Images are pinned; bump deliberately.
#
# Every service listens on 127.0.0.1 only, except nginx (ports 80 and 443)
# and node-exporter (9100, which Prometheus scrapes at the private IP).
#
services:
  pushgateway:
    container_name: pushgateway
    network_mode: host
    pid: host
    restart: unless-stopped
    image: prom/pushgateway:v1.11.4
    command: ['--web.listen-address=127.0.0.1:9091']

  prometheus:
    container_name: prometheus
    network_mode: host
    pid: host
    restart: unless-stopped
    environment:
      # Credentials refreshed by host-side systemd timer (refresh-ec2-credentials.sh).
      # Required because Imds.Secured=true blocks non-root IMDS access inside containers.
      - 'AWS_SHARED_CREDENTIALS_FILE=/run/prometheus-ec2-creds/credentials'
    volumes:
      - '__MONITORING_HOME__/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
      - '__MONITORING_HOME__/prometheus/rules:/etc/prometheus/rules:ro'
      - 'prometheus-data:/prometheus'
      - '/run/prometheus-ec2-creds:/run/prometheus-ec2-creds:ro'
    group_add:
      # Read access to /run/prometheus-ec2-creds (root:monitoring-creds,
      # 0750/0640). installer/install.sh substitutes the group's GID.
      - '__CREDS_GID__'
    image: prom/prometheus:v3.16.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
      - '--web.listen-address=127.0.0.1:9090'

  grafana:
    container_name: grafana
    network_mode: host
    pid: host
    restart: unless-stopped
    environment:
      # Password is read from a file that a host-side systemd timer
      # (refresh-grafana-password.sh) populates from SSM Parameter Store.
      # Rotate the SSM parameter and the timer will pick up the new value.
      - 'GF_SECURITY_ADMIN_PASSWORD__FILE=/run/grafana-secrets/admin-password'
      # GF_SERVER_ROOT_URL comes from cognito.env (env_file below): a value
      # here would override the file's.
      - 'GF_SERVER_HTTP_ADDR=127.0.0.1'
      # Land every user on ParallelCluster Summary after login.
      - 'GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/ParallelCluster.json'
      # AWS creds for the CloudWatch datasource (Logs dashboard). Same
      # host-refreshed credentials file Prometheus/cloudwatch-exporter use;
      # required because Imds.Secured=true blocks IMDS from containers.
      - 'AWS_SHARED_CREDENTIALS_FILE=/run/prometheus-ec2-creds/credentials'
      # Grafana 13.3 runs the CloudWatch datasource as a separate plugin
      # process, which gets Grafana's environment, and with it the variable
      # above, only when its plugin id is listed here. That environment
      # also holds GF_SECURITY_ADMIN_PASSWORD and, with Cognito,
      # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: the image's entrypoint replaces
      # each GF_*__FILE variable with one that holds the file's content.
      # The plugin runs as Grafana's user in this container, and that user
      # can read both files in /run/grafana-secrets/ anyway.
      - 'GF_PLUGINS_FORWARD_HOST_ENV_VARS=cloudwatch'
      # Run the plugins that the image bundles. By default Grafana updates
      # them from grafana.com when it starts (CloudWatch 12.11.3 to 12.11.5,
      # for example), so the plugin that reads the credentials file would
      # change without a new image pin.
      - 'GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false'
    env_file:
      # Written by refresh-grafana-cognito.sh at install and at every boot,
      # from the optional Cognito parameter in SSM: GF_SERVER_ROOT_URL, the
      # URL that users open Grafana at (root_url, by default
      # https://localhost:8443/grafana/), and, when Cognito SSO is
      # configured, the OAuth2 settings. Grafana builds the OAuth2 callback
      # URL from the root URL.
      - '/run/grafana-secrets/cognito.env'
    volumes:
      - '__MONITORING_HOME__/grafana:/etc/grafana/provisioning'
      - 'grafana-data:/var/lib/grafana'
      - '/run/grafana-secrets:/run/grafana-secrets:ro'
      - '/run/prometheus-ec2-creds:/run/prometheus-ec2-creds:ro'
    group_add:
      # Read access to /run/prometheus-ec2-creds (root:monitoring-creds,
      # 0750/0640). installer/install.sh substitutes the group's GID.
      - '__CREDS_GID__'
    image: grafana/grafana:13.3.2

  prometheus-node-exporter:
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/var/lib/prometheus/node-exporter:/textfile:ro'
    image: quay.io/prometheus/node-exporter:v1.13.1
    command:
      - '--path.rootfs=/host'
      - '--collector.infiniband'
      - '--collector.textfile'
      - '--collector.textfile.directory=/textfile'

  nginx:
    container_name: nginx
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '__MONITORING_HOME__/nginx/conf.d:/etc/nginx/conf.d/'
      - '__MONITORING_HOME__/nginx/ssl:/etc/ssl/'
      - '__MONITORING_HOME__/www:/usr/share/nginx/html'
    # Stable-branch tag: it follows the 1.30.x patch releases. nginx opens a
    # new stable branch each April; review this tag then.
    image: nginx:1.30-alpine

  cloudwatch-exporter:
    container_name: cloudwatch-exporter
    # Not on the host network: the exporter takes a port but no listen
    # address, so under network_mode: host it would listen on every
    # interface. Published on 127.0.0.1 only; Prometheus scrapes
    # localhost:9106.
    ports:
      - '127.0.0.1:9106:9106'
    pid: host
    restart: unless-stopped
    environment:
      - 'AWS_SHARED_CREDENTIALS_FILE=/run/prometheus-ec2-creds/credentials'
    volumes:
      - '__MONITORING_HOME__/cloudwatch-exporter/config.yml:/config/config.yml:ro'
      - '/run/prometheus-ec2-creds:/run/prometheus-ec2-creds:ro'
    group_add:
      # Read access to /run/prometheus-ec2-creds (root:monitoring-creds,
      # 0750/0640). installer/install.sh substitutes the group's GID.
      - '__CREDS_GID__'
    image: prom/cloudwatch-exporter:v0.19.0

volumes:
  prometheus-data:
  grafana-data:
