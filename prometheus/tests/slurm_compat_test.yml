            value: 0
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="mix",partition="q"}'
            value: 0
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="drng",partition="q"}'
            value: 0
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="idle",partition="q"}'
            value: 1
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="idle~",partition="q"}'
            value: 0
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="down",partition="q"}'
            value: 1
          - labels: 'slurm_partition_node_count{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="drain",partition="q"}'
            value: 1
      - expr: 'slurm_cpus_per_state{state="idle~"}'
        eval_time: 2m
        exp_samples:
          - labels: 'slurm_cpus_per_state{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",state="idle~"}'
            value: 0
      # Cluster Summary: Total Nodes, Nodes Allocated, Nodes Idle and Nodes Down/Drain.
      - expr: '(sum(slurm_node_count_per_state)) or vector(0)'
        eval_time: 2m
        exp_samples:
