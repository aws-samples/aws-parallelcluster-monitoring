  - interval: 30s
    input_series:
      - series: 'slurm_partition_nodes{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",partition="q"}'
        values: '3x10'
      - series: 'slurm_partition_nodes_alloc{job="slurm_openmetrics_partitions",instance="localhost:6820",slurm_endpoint="partitions",partition="q"}'
