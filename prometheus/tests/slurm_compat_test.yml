        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
      # Slurm Detail Partitions: Nodes Busy (A), Nodes Idle (B) and Nodes Down/Drain (C).
      - expr: 'sum by(partition) (slurm_partition_node_count{state!~"idle.*|down.*|drain.*|drng.*"}) or sum by(partition) (slurm_partition_node_count) * 0'
        eval_time: 2m
        exp_samples:
          - labels: '{partition="empty"}'
            value: 0
          - labels: '{partition="q"}'
            value: 0
      - expr: 'sum by(partition) (slurm_partition_node_count{state=~"idle.*"})'
        eval_time: 2m
        exp_samples:
          - labels: '{partition="empty"}'
            value: 0
          - labels: '{partition="q"}'
            value: 1
      - expr: 'sum by(partition) (slurm_partition_node_count{state=~"down.*|drain.*|drng.*"})'
        eval_time: 2m
        exp_samples:
          - labels: '{partition="empty"}'
            value: 0
          - labels: '{partition="q"}'
            value: 2
