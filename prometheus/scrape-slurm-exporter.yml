# The Slurm scrape job of a ParallelCluster head node whose slurmctld
# doesn't serve Slurm's native metrics: the Slurm exporter
# (rivosinc/prometheus-slurm-exporter, slurm_exporter.service) on
# 127.0.0.1:9092. installer/install.sh copies the job below, indented by two
# spaces, between the "# BEGIN slurm_metrics" and "# END slurm_metrics"
# lines of prometheus/prometheus.yml. See docs/slurm-metrics.md.
- job_name: 'slurm_exporter'
  scrape_interval: 30s
  scrape_timeout: 30s
  static_configs:
    - targets: ['localhost:9092']
